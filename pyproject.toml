[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dixie-flatline"
version = "0.1.0"
description = "LLM-driven red team penetration testing tool"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "litellm>=1.60",
    "pydantic>=2.0",
    "docker>=7.0",
    "click>=8.1",
    "rich>=13.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[project.scripts]
dixie = "dixie.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dixie"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
